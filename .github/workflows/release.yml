name: Build

on:
  push:
    branches:
      - stable

jobs:
  TagRaw:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag_label.outputs.tag }}
      changelog: ${{ steps.tag_raw.outputs.changelog }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # A version set by hand in Cargo.toml and not released yet wins over
      # the one derived from the conventional commits.
      - name: "Take the version from Cargo.toml if not tagged yet"
        id: cargo_version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "custom_tag=" >> "$GITHUB_OUTPUT"
          else
            echo "custom_tag=$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: "Bump version and push tag - dry run"
        id: tag_raw
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: stable
          custom_tag: ${{ steps.cargo_version.outputs.custom_tag }}
          tag_prefix:
          dry_run: true
      - name: "Format tag"
        id: tag_label
        env:
          TAG: ${{ steps.tag_raw.outputs.new_tag }}
        run: |
          TAG=$(echo "$TAG" | cut -f1 -d "-")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  Changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Check file present"
        run: |
          [[ -f CHANGELOG.md ]] || touch CHANGELOG.md
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3 # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: "Generate CHANGELOG"
        env:
          CHANGELOG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gem install github_changelog_generator
          USER=$(echo "$GITHUB_REPOSITORY" | sed -e 's/\// /g' | awk '{print $1}')
          PROJECT=$(echo "$GITHUB_REPOSITORY" | sed -e 's/\// /g' | awk '{print $2}')
          echo "$USER $PROJECT"
          github_changelog_generator --user "$USER" --project "$PROJECT" --no-unreleased
      - name: 'Upload Artifact Changelog'
        uses: actions/upload-artifact@v7
        with:
          name: changelog-artifact
          path: CHANGELOG.md
          retention-days: 1

  Version:
    needs: TagRaw
    runs-on: ubuntu-latest
    outputs:
      version_path: ${{ steps.update_version.outputs.version_path }}
      version_dir: ${{ steps.update_version.outputs.version_dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stable
      - name: "Update Cargo.toml version"
        id: update_version
        env:
          TAG: ${{ needs.TagRaw.outputs.tag }}
        run: |
          VERSION_PATH=Cargo.toml
          VERSION_DIR=$(dirname "$VERSION_PATH")
          sed -i "0,/^version = \".*\"/s//version = \"$TAG\"/" "$VERSION_PATH"
          echo "version_path=$VERSION_PATH" >> "$GITHUB_OUTPUT"
          echo "version_dir=$VERSION_DIR" >> "$GITHUB_OUTPUT"
      - name: 'Upload Artifact Version'
        uses: actions/upload-artifact@v7
        with:
          name: version-artifact
          path: ${{ steps.update_version.outputs.version_path }}
          retention-days: 1

  ThirdParty:
    needs: Version
    runs-on: ubuntu-latest
    outputs:
      thirdparty_path: ${{ steps.third_party.outputs.thirdparty_path }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stable
      - name: "Install cargo-bundle-licenses"
        run: cargo install cargo-bundle-licenses
      - name: "Update Thirdparty"
        id: third_party
        run: |
          THIRDPARTY_PATH=THIRDPARTY.yaml
          cargo bundle-licenses --format yaml --output "$THIRDPARTY_PATH"
          echo "thirdparty_path=$THIRDPARTY_PATH" >> "$GITHUB_OUTPUT"
      - name: "Upload Artifact ThirdParty"
        uses: actions/upload-artifact@v7
        with:
          name: third-party-artifact
          path: ${{ steps.third_party.outputs.thirdparty_path }}
          retention-days: 1

  Commit:
    needs: [Changelog, Version, ThirdParty]
    runs-on: ubuntu-latest
    steps:
      # Get Data
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 'Download Artifact Version'
        uses: actions/download-artifact@v8
        with:
          name: version-artifact
          path: ${{ needs.Version.outputs.version_dir }}
      - name: 'Download Artifact Changelog'
        uses: actions/download-artifact@v8
        with:
          name: changelog-artifact
      - name: "Download Artifact ThirdParty"
        uses: actions/download-artifact@v8
        with:
          name: third-party-artifact
      # Commit
      - name: "Commit files"
        run: |
          git config --local user.email "$GITHUB_EMAIL"
          git config --local user.name "$GITHUB_USERNAME"
          git add .
          git commit -m "doc(changelog): update"
        env:
          GITHUB_USERNAME: guillaume-gricourt
          GITHUB_EMAIL: guipagui@gmail.com
      - name: "Push changes"
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
      - name: "Update main branch"
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

  Tag:
    needs: [Commit, TagRaw]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Bump version and push tag"
        id: tag
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: stable
          custom_tag: ${{ needs.TagRaw.outputs.tag }}
          tag_prefix:

  Release:
    needs: [TagRaw, Commit]
    runs-on: ubuntu-latest
    steps:
      - name: 'Create Release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.TagRaw.outputs.tag }}
          body: ${{ needs.TagRaw.outputs.changelog }}

  Build:
    needs: [TagRaw, Release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stable
          persist-credentials: false
      - name: "Build"
        run: cargo build --release --target ${{ matrix.target }}
      - name: "Package"
        id: package
        env:
          TAG: ${{ needs.TagRaw.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          NAME="HmnRandomRead-$TAG-$TARGET"
          mkdir "$NAME"
          cp "target/$TARGET/release/HmnRandomRead" LICENSE README.md "$NAME/"
          "$NAME/HmnRandomRead" version
          if [ "$RUNNER_OS" = "Linux" ]; then ldd "$NAME/HmnRandomRead"; else otool -L "$NAME/HmnRandomRead"; fi
          tar -czf "$NAME.tar.gz" "$NAME"
          echo "archive=$NAME.tar.gz" >> "$GITHUB_OUTPUT"
      - name: "Upload to the release"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.TagRaw.outputs.tag }}
          files: ${{ steps.package.outputs.archive }}
