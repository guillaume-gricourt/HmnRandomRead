[package]
name = "hmnrandomread"
version = "0.11.0"
edition = "2021"
description = "Simulate paired-end FASTQ reads from reference genomes"
license = "MIT"

[[bin]]
name = "HmnRandomRead"
path = "src/main.rs"

[lib]
name = "hmnrandomread"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rust-htslib = "0.50"
rand = "0.8"
rand_distr = "0.4"
flate2 = "1.1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
